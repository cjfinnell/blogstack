name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:
    inputs:
      site:
        description: Site to deploy, or "all"
        required: true
        default: all

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sites: ${{ steps.resolve.outputs.sites }}
      cms_changed: ${{ steps.resolve.outputs.cms_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: resolve
        run: npm run resolve-deploy-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALL_SITES: ${{ vars.SITES }}
          DISPATCH_SITE: ${{ github.event.client_payload.site }}
          INPUT_SITE: ${{ github.event.inputs.site }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  # CMS and web deploy in one job per site. They were two jobs, both declaring
  # `environment: ${{ matrix.site }}`, which filed two GitHub deployments per
  # site per push — the web one immediately marking the CMS one inactive, so the
  # deployments page showed a superseded record for every real deploy. One job
  # also drops the `always()` / `result == 'skipped'` gate that existed only to
  # let deploy-web run when the CMS was unchanged.
  deploy:
    needs: resolve
    if: needs.resolve.outputs.sites != '[]'
    strategy:
      matrix:
        site: ${{ fromJSON(needs.resolve.outputs.sites) }}
      # One site's deploy failing must not cancel another's mid-flight.
      fail-fast: false
    runs-on: ubuntu-latest
    concurrency:
      # Serialize, never cancel: cancelling mid-deploy can leave D1 migrations
      # applied with the matching Worker not yet shipped.
      group: deploy-${{ matrix.site }}
      cancel-in-progress: false
    environment: ${{ matrix.site }}
    # No `environment.url`: it would publish the site's production hostname on
    # the repo's public deployments page, which is the thing PLAN.md#anonymity
    # keeps out of the repo in the first place.
    permissions:
      contents: read
      deployments: write
    # The `secrets` context is not allowed inside `if:` conditionals at all
    # (job or step level) — GitHub rejects the whole workflow file at parse
    # time with "Unrecognized named-value: 'secrets'" if you try. Computing
    # it into a job-level env var here (secrets IS allowed in `env:`) is the
    # workaround; the draft steps below gate on `env.HAS_WEB_DRAFT` instead.
    env:
      HAS_WEB_DRAFT: ${{ secrets.WEB_DRAFT_HOST != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
      - run: npm run ci-gen-wrangler
        env:
          CURRENT_SITE: ${{ matrix.site }}
          CMS_HOST: ${{ secrets.CMS_HOST }}
          WEB_HOST: ${{ secrets.WEB_HOST }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          D1_ID: ${{ secrets.D1_ID }}
          WEB_DRAFT_HOST: ${{ secrets.WEB_DRAFT_HOST }}

      # CMS first: the web build reads content from it, so a schema change has
      # to land before the site that renders it.
      - name: Apply D1 migrations
        if: needs.resolve.outputs.cms_changed == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env cms_${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy CMS
        if: needs.resolve.outputs.cms_changed == 'true'
        run: npx wrangler deploy --env cms_${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Idempotent — seed-admin.ts no-ops if the user already exists — so
      # gating on cms_changed just skips it on web-only deploys.
      - name: Seed CMS admin
        if: needs.resolve.outputs.cms_changed == 'true'
        run: npm run seed
        env:
          SEED_REMOTE: '1'
          SEED_ENV: cms_${{ matrix.site }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build web
        run: npm run build --workspace apps/web-${{ matrix.site }}
        env:
          CMS_URL: https://${{ secrets.CMS_HOST }}
          SITE_URL: ${{ secrets.WEB_ORIGIN }}
      # Second net under the placeholder guard. The build already refuses to
      # render unfilled site settings; this catches a placeholder that reached
      # the page by any other route. Nothing the site owner did not write ships.
      - name: Check for placeholder copy
        run: npm run check:copy -- apps/web-${{ matrix.site }}/dist
      - name: Deploy web
        run: npx wrangler deploy --env web_${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # admin-draft: same app, same build just built above — rebuilt here
      # with RENDER_MODE=ssr so it renders drafts+published on every request
      # against the SAME cms_${{ matrix.site }} deployed above. No separate
      # CMS/D1/R2, no separate GitHub Environment: WEB_DRAFT_HOST is the only
      # secret this needs beyond what the job already has from CMS_HOST.
      #
      # Gated on WEB_DRAFT_HOST being set (not required — see
      # ci-gen-wrangler.ts) so a site can keep deploying its CMS/web Worker
      # normally before admin-draft is rolled out for it; rolling it out for
      # one site must not require touching the other two.
      - name: Build web (draft)
        if: env.HAS_WEB_DRAFT == 'true'
        run: npm run build --workspace apps/web-${{ matrix.site }}
        env:
          CMS_URL: https://${{ secrets.CMS_HOST }}
          SITE_URL: ${{ secrets.WEB_DRAFT_ORIGIN }}
          RENDER_MODE: ssr
      - name: Deploy web (draft)
        if: env.HAS_WEB_DRAFT == 'true'
        run: npx wrangler deploy --env web_${{ matrix.site }}_draft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
