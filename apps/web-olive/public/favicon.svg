<!--
  The bow, unfiltered.

  This is the #bowFlat variant from src/components/BowDefs.astro, inlined here
  because a favicon cannot reference the page's <defs>. Below roughly 32px the
  displacement and grain filters turn to mud, so the flat drawing is the only
  honest option at this size — and the wordmark does not survive here at all,
  which is why the mark is the bow rather than a letter.

  Colours are literal rather than tokens: a favicon renders outside the
  document, so var(--rib-a2) has nothing to resolve against. The two values are
  the light-mode ribbon and knot. `prefers-color-scheme` below lifts them for
  dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <style>
    .ribbon { stroke: #7B95C9; }
    .knot { fill: #617AB4; }
    @media (prefers-color-scheme: dark) {
      .ribbon { stroke: #8FA9D2; }
      .knot { fill: #7B93C4; }
    }
  </style>
  <g class="ribbon" fill="none" stroke-width="25" stroke-linecap="round">
    <path d="M150 74 C 126 20, 52 2, 26 32 C 2 60, 62 90, 145 78" />
    <path d="M150 74 C 174 20, 248 2, 274 32 C 298 60, 238 90, 155 78" />
    <path d="M142 90 C 130 118, 154 138, 122 166 C 98 188, 84 214, 52 236" />
    <path d="M158 90 C 172 118, 148 140, 182 168 C 208 190, 226 216, 256 240" />
  </g>
  <path
    class="knot"
    d="M150 52 C 130 53, 120 64, 122 78 C 124 92, 138 99, 151 98 C 165 97, 178 88, 179 74 C 180 60, 168 51, 150 52 Z"
  />
</svg>
