name = "blogstack"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# main is deliberately NOT top-level. Assets-only workers must omit it,
# and there is no way to un-inherit a key, so each cms_* env declares it.

# ---------- local dev CMS ----------
[env.dev]
name = "blogstack-cms-dev"
main = "apps/cms/src/index.ts"
workers_dev = true
vars = { ENVIRONMENT = "development", SITE_ID = "dev", CORS_ORIGINS = "http://localhost:4321,http://localhost:4322,http://localhost:4323,http://localhost:4324" }
d1_databases = [{ binding = "DB", database_name = "blogstack-dev-db", database_id = "${DEV_D1_ID}", migrations_dir = "./node_modules/@sonicjs-cms/core/migrations", remote = true }]
r2_buckets = [{ binding = "MEDIA_BUCKET", bucket_name = "blogstack-dev-media" }]

[env.web_dev]
name = "blogstack-web-dev"
workers_dev = true
assets = { directory = "apps/web-dev/dist" }

# ---------- terminal ----------
[env.cms_terminal]
name = "blogstack-cms-terminal"
main = "apps/cms/src/index.ts"
workers_dev = false
routes = [{ pattern = "${TERMINAL_CMS_HOST}", custom_domain = true }]
vars = { ENVIRONMENT = "production", SITE_ID = "terminal", CORS_ORIGINS = "${TERMINAL_WEB_ORIGIN}", GITHUB_REPO = "cjfinnell/blogstack" }
d1_databases = [{ binding = "DB", database_name = "blogstack-terminal-db", database_id = "${TERMINAL_D1_ID}", migrations_dir = "./node_modules/@sonicjs-cms/core/migrations", remote = true }]
r2_buckets = [{ binding = "MEDIA_BUCKET", bucket_name = "blogstack-terminal-media" }]

[env.web_terminal]
name = "blogstack-web-terminal"
workers_dev = false
# preview_urls is deliberately off. It existed for `wrangler versions upload`
# previews, which are gone (see the preview_* envs below). Leaving it on would
# give every *production* version a public <hash>-blogstack-web-terminal.workers.dev
# URL that bypasses the custom domain.
preview_urls = false
assets = { directory = "apps/web-terminal/dist" }
routes = [{ pattern = "${TERMINAL_WEB_HOST}", custom_domain = true }]

# admin-draft: same app (apps/web-terminal), same @blogstack/astro-shared
# components — nothing here is a second copy of the theme. The only
# difference is the build: RENDER_MODE=ssr flips output:'server' at build
# time (see astro.config.mjs) and the client bakes in includeDrafts, so this
# Worker renders drafts+published on every request against the SAME CMS as
# env.cms_terminal above — no separate CMS/D1/R2 deployed for this target.
# `main` (not `assets`-only) because this is a Worker script, not a static
# bundle: paths match @astrojs/cloudflare's build/server output tree exactly
# (dist/server/entry.mjs, dist/client/ — verified against a real build, not
# assumed).
[env.web_terminal_draft]
name = "blogstack-web-terminal-draft"
workers_dev = false
preview_urls = false
main = "apps/web-terminal/dist/server/entry.mjs"
assets = { directory = "apps/web-terminal/dist/client", binding = "ASSETS" }
routes = [{ pattern = "${TERMINAL_WEB_DRAFT_HOST}", custom_domain = true }]

# ---------- folio ----------
[env.cms_folio]
name = "blogstack-cms-folio"
main = "apps/cms/src/index.ts"
workers_dev = false
routes = [{ pattern = "${FOLIO_CMS_HOST}", custom_domain = true }]
vars = { ENVIRONMENT = "production", SITE_ID = "folio", CORS_ORIGINS = "${FOLIO_WEB_ORIGIN}", GITHUB_REPO = "cjfinnell/blogstack" }
d1_databases = [{ binding = "DB", database_name = "blogstack-folio-db", database_id = "${FOLIO_D1_ID}", migrations_dir = "./node_modules/@sonicjs-cms/core/migrations", remote = true }]
r2_buckets = [{ binding = "MEDIA_BUCKET", bucket_name = "blogstack-folio-media" }]

[env.web_folio]
name = "blogstack-web-folio"
workers_dev = false
preview_urls = false
assets = { directory = "apps/web-folio/dist" }
routes = [{ pattern = "${FOLIO_WEB_HOST}", custom_domain = true }]

# admin-draft — see env.web_terminal_draft above for the full rationale.
[env.web_folio_draft]
name = "blogstack-web-folio-draft"
workers_dev = false
preview_urls = false
main = "apps/web-folio/dist/server/entry.mjs"
assets = { directory = "apps/web-folio/dist/client", binding = "ASSETS" }
routes = [{ pattern = "${FOLIO_WEB_DRAFT_HOST}", custom_domain = true }]

# ---------- olive ----------
[env.cms_olive]
name = "blogstack-cms-olive"
main = "apps/cms/src/index.ts"
workers_dev = false
routes = [{ pattern = "${OLIVE_CMS_HOST}", custom_domain = true }]
vars = { ENVIRONMENT = "production", SITE_ID = "olive", CORS_ORIGINS = "${OLIVE_WEB_ORIGIN}", GITHUB_REPO = "cjfinnell/blogstack" }
d1_databases = [{ binding = "DB", database_name = "blogstack-olive-db", database_id = "${OLIVE_D1_ID}", migrations_dir = "./node_modules/@sonicjs-cms/core/migrations", remote = true }]
r2_buckets = [{ binding = "MEDIA_BUCKET", bucket_name = "blogstack-olive-media" }]

[env.web_olive]
name = "blogstack-web-olive"
workers_dev = false
preview_urls = false
assets = { directory = "apps/web-olive/dist" }
routes = [{ pattern = "${OLIVE_WEB_HOST}", custom_domain = true }]

# admin-draft — see env.web_terminal_draft above for the full rationale.
[env.web_olive_draft]
name = "blogstack-web-olive-draft"
workers_dev = false
preview_urls = false
main = "apps/web-olive/dist/server/entry.mjs"
assets = { directory = "apps/web-olive/dist/client", binding = "ASSETS" }
routes = [{ pattern = "${OLIVE_WEB_DRAFT_HOST}", custom_domain = true }]

# ---------- per-PR previews ----------
# One block per deployed site. Assets-only, workers.dev, no routes and no
# custom domain, so a preview can never answer on a production hostname.
#
# The `name` here is a placeholder: preview.yml always passes
# `--name blogstack-web-<site>-pr-<N>`, giving each PR its own standalone
# Worker. That is the whole point — a per-PR Worker can be `wrangler delete`d
# when the PR closes, whereas the old `wrangler versions upload` approach put a
# version on the *production* Worker and Cloudflare has no per-version delete,
# so those preview URLs outlived the PR indefinitely.
#
# These blocks are deliberately placeholder-free: previews build against the
# dev CMS and never see a production hostname.
[env.preview_terminal]
name = "blogstack-web-terminal-preview"
workers_dev = true
assets = { directory = "apps/web-terminal/dist" }

[env.preview_folio]
name = "blogstack-web-folio-preview"
workers_dev = true
assets = { directory = "apps/web-folio/dist" }

[env.preview_olive]
name = "blogstack-web-olive-preview"
workers_dev = true
assets = { directory = "apps/web-olive/dist" }
